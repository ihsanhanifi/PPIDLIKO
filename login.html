<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow"> <!-- Mencegah indeksasi oleh search engine -->
    <meta name="description" content="Halaman Login Administrator PPID Kemenag Kab. Lima Puluh Kota">
    <title>Login Administrator - PPID Kemenag Liko</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #007D40 0%, #00562b 100%); padding: 20px; }
        
        .login-container { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            overflow: hidden; 
            max-width: 420px; 
            width: 100%; 
            animation: slideUp 0.5s ease; 
        }
        
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .login-header { 
            background: linear-gradient(135deg, #007D40, #00562b); 
            color: white; 
            padding: 35px 30px; 
            text-align: center; 
        }
        .login-header i { font-size: 50px; margin-bottom: 15px; }
        .login-header h1 { font-size: 22px; margin-bottom: 5px; font-weight: 600; }
        .login-header p { font-size: 13px; opacity: 0.9; }
        
        .login-body { padding: 35px 30px; }
        
        .admin-notice {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            color: #856404;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; font-size: 14px; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i.input-icon { 
            position: absolute; 
            left: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #999; 
            pointer-events: none;
        }
        
        .form-group input { 
            width: 100%; 
            padding: 12px 45px 12px 45px; 
            border: 2px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 15px; 
            transition: all 0.3s; 
            outline: none; 
        }
        .form-group input:focus { 
            border-color: #007D40; 
            box-shadow: 0 0 0 3px rgba(0, 125, 64, 0.1); 
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s;
            z-index: 10;
        }
        .toggle-password:hover { color: #007D40; }
        
        .btn-login { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #007D40, #00562b); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s; 
            margin-top: 10px; 
        }
        .btn-login:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 20px rgba(0, 125, 64, 0.3); 
        }
        .btn-login:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
            transform: none; 
        }
        
        .alert { 
            padding: 12px 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-size: 14px; 
            display: none; 
        }
        .alert-error { background: #fee; color: #c33; border: 1px solid #fcc; }
        .alert-success { background: #efe; color: #3c3; border: 1px solid #cfc; }
        
        .back-link { text-align: center; margin-top: 25px; }
        .back-link a { 
            color: #666; 
            text-decoration: none; 
            font-size: 14px; 
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .back-link a:hover { color: #007D40; }
        
        /* Connection Status Indicator */
        .connection-status {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #6c757d;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .connection-status.success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
        .connection-status.error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-user-shield"></i>
            <h1>Login Administrator</h1>
            <p>PPID Kemenag Kab. Lima Puluh Kota</p>
        </div>
        <div class="login-body">
            
            <!-- Peringatan Khusus Admin -->
            <div class="admin-notice">
                <i class="fas fa-exclamation-circle"></i>
                <span>Halaman ini khusus untuk petugas administrator.</span>
            </div>

            <!-- Indikator Koneksi Database -->
            <div id="connection-status" class="connection-status">
                <i class="fas fa-circle-notch fa-spin"></i>
                <span>Memeriksa koneksi sistem...</span>
            </div>

            <div id="alert" class="alert"></div>
            
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="toggle-password" title="Tampilkan/Sembunyikan Password" tabindex="-1" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" id="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Masuk ke Dashboard
                </button>
            </form>

            <div class="back-link">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i> Kembali ke Halaman Utama
                </a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script>
        // 1. Cek sesi dan koneksi database saat halaman dimuat
        window.addEventListener('DOMContentLoaded', async () => {
            const session = CONFIG.getCurrentUser();
            if (session && session.role === 'admin') {
                window.location.href = 'dashboard.html';
                return;
            }

            // Test koneksi ke Google Apps Script
            const statusEl = document.getElementById('connection-status');
            try {
                const testResult = await api.getProfil();
                if (testResult.success) {
                    statusEl.className = 'connection-status success';
                    statusEl.innerHTML = '<i class="fas fa-check-circle"></i><span>Sistem siap</span>';
                } else {
                    throw new Error(testResult.error);
                }
            } catch (error) {
                statusEl.className = 'connection-status error';
                statusEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i><span>Koneksi sistem terganggu</span>';
            }
        });

        // 2. Fitur Toggle Password Visibility (Eye)
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                this.setAttribute('aria-label', 'Sembunyikan password');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                this.setAttribute('aria-label', 'Tampilkan password');
            }
            passwordInput.focus();
        });

        // 3. Handle Login Submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const alert = document.getElementById('alert');
            
            if (!username || !password) {
                alert.className = 'alert alert-error';
                alert.textContent = 'Username dan password wajib diisi.';
                alert.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';
            alert.style.display = 'none';
            
            const result = await api.login(username, password);
            
            if (result.success) {
                localStorage.setItem('ppid_session', JSON.stringify(result.user));
                
                alert.className = 'alert alert-success';
                alert.textContent = 'Login berhasil! Mengalihkan ke Dashboard...';
                alert.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                alert.className = 'alert alert-error';
                alert.textContent = result.error || 'Username atau password salah. Silakan coba lagi.';
                alert.style.display = 'block';
                
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk ke Dashboard';
                
                // Bersihkan password dan kembalikan fokus untuk keamanan
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
